<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADSSC signature generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --salt:#EEF1F0; --panel:#FFFFFF; --ink:#1F2A2C; --muted:#5E6A6C; --line:#D5DCDB;
  --caramel:#BD7B4E; --ochre:#D8A76B; --gold:#EAD59A; --teal:#2E94A0;
  --field:#F7F9F8; --focus:#2E94A0; --ok:#2E7D5B; --warn:#9A5B1E;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --salt:#151B1C; --panel:#1E2627; --ink:#E8ECEB; --muted:#A3AEAD; --line:#33403F;
    --field:#243031; --caramel:#C68A50; --ochre:#D8AF72; --teal:#89AFAD; --ok:#7FC3A2; --warn:#E0A96B;
  }
}
:root[data-theme="dark"]{
  --salt:#151B1C; --panel:#1E2627; --ink:#E8ECEB; --muted:#A3AEAD; --line:#33403F;
  --field:#243031; --caramel:#C68A50; --ochre:#D8AF72; --teal:#89AFAD; --ok:#7FC3A2; --warn:#E0A96B;
}
*{box-sizing:border-box}
body{margin:0;background:var(--salt);color:var(--ink);font-family:"Assistant",Arial,sans-serif;font-size:16px;line-height:1.5}
.strata{height:14px;display:grid;grid-template-rows:5px 3px 2px 4px}
.strata i:nth-child(1){background:var(--caramel)}
.strata i:nth-child(2){background:var(--ochre)}
.strata i:nth-child(3){background:var(--gold)}
.strata i:nth-child(4){background:var(--teal)}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 60px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px}
h1{font-size:30px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em}
header p{margin:6px 0 0;color:var(--muted);max-width:52ch}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--panel)}
.lang button{border:0;background:none;font:inherit;font-weight:600;color:var(--muted);padding:6px 16px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:28px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.form{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px}
.form h2,.out h2{font-size:18px;margin:0 0 14px}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 5px}
label small{font-weight:400;color:var(--muted)}
input{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:4px;padding:9px 11px}
input.ltr{direction:ltr;text-align:start}
[dir="rtl"] input.ltr{text-align:right}
input:focus-visible,button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input[aria-invalid="true"]{border-color:var(--warn)}
.emailbox{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:4px;background:var(--field);overflow:hidden}
.emailbox:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.emailbox input{border:0;border-radius:0;flex:1;min-width:0;text-align:left;outline:none}
.emailbox:has(input[aria-invalid="true"]){border-color:var(--warn)}
.domain{display:flex;align-items:center;padding:0 11px;color:var(--muted);background:var(--panel);border-left:1px solid var(--line);white-space:nowrap}
.err{color:var(--warn);font-size:13px;margin-top:4px;min-height:0}
.fixed{margin-top:20px;padding-top:16px;border-top:1px dashed var(--line);font-size:14px;color:var(--muted)}
.fixed b{color:var(--ink);font-weight:600}
.out{position:sticky;top:16px}
@media (max-width:860px){.out{position:static}}
.stage{border-radius:6px;border:1px solid var(--line);overflow:hidden}
.stagebar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.seg{display:inline-flex;gap:2px}
.seg[hidden]{display:none}
.stagebar{flex-wrap:wrap}
.seg button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--field);color:var(--ink);padding:3px 10px;cursor:pointer}
.seg button:first-child{border-start-start-radius:4px;border-end-start-radius:4px}
.seg button:last-child{border-start-end-radius:4px;border-end-end-radius:4px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.mail{background:#FFFFFF;color:#222;padding:26px 24px 30px;overflow-x:auto;font-family:Arial,sans-serif}
.mail .body{font-size:14px;color:#444;margin:0 0 20px}
.mail.dark{background:#202124}
.mail.dark .body{color:#ddd}
.mail.dark #sig{filter:invert(1) hue-rotate(180deg)}
.mail.dark #sig img{filter:invert(1) hue-rotate(180deg)}
.note{font-size:13px;color:var(--muted);margin:8px 2px 0}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 6px}
.btn{font:inherit;font-weight:600;border-radius:4px;padding:10px 18px;cursor:pointer;border:1px solid var(--ink)}
.btn.primary{background:var(--ink);color:var(--panel)}
.btn.ghost{background:transparent;color:var(--ink)}
.check[hidden]{display:none}
.check{display:flex;gap:8px;align-items:center;margin-top:18px;font-weight:600;font-size:14px}
.check input{width:auto;margin:0;accent-color:var(--teal)}
.appq{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:18px}
.appq-label{font-weight:600;font-size:14px}
.appq .seg button{font-size:14px;padding:5px 12px}
.status{font-size:14px;min-height:22px;color:var(--ok)}
.status.bad{color:var(--warn)}
.meter{font-size:13px;color:var(--muted)}
details{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:6px}
summary{cursor:pointer;padding:14px 18px;font-weight:600}
.guide{padding:0 18px 18px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tabs button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:4px;padding:5px 12px;cursor:pointer}
.tabs button[aria-selected="true"]{border-color:var(--teal);box-shadow:inset 0 -3px 0 var(--teal)}
.guide ol{margin:0;padding-inline-start:22px}
.guide li{margin:5px 0}
pre{font-family:"IBM Plex Mono",Consolas,monospace;font-size:12px;background:var(--field);border:1px solid var(--line);border-radius:4px;padding:12px;overflow-x:auto;direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-all;max-height:260px;margin:0 18px 18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="strata" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="wrap">
  <header>
    <div>
      <h1 data-t="title"></h1>
      <p data-t="intro"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="he" aria-pressed="true">עברית</button>
      <button type="button" data-lang="en" aria-pressed="false">English</button>
    </div>
  </header>

  <div class="grid">
    <section class="form" aria-labelledby="formh">
      <h2 id="formh" data-t="yourDetails"></h2>
      <label for="f-name" data-t="name"></label>
      <input id="f-name" autocomplete="name">
      <label for="f-title" data-t="role"></label>
      <input id="f-title" autocomplete="organization-title">
      <label for="f-dept"><span data-t="dept"></span> <small data-t="optional"></small></label>
      <input id="f-dept">
      <label for="f-mobile"><span data-t="mobile"></span> <small data-t="optional"></small></label>
      <input id="f-mobile" class="ltr" type="tel" autocomplete="tel" dir="ltr">
      <label for="f-office"><span data-t="office"></span> <small data-t="optional"></small></label>
      <input id="f-office" class="ltr" type="tel" dir="ltr">
      <label for="f-email" data-t="email"></label>
      <div class="emailbox" dir="ltr">
        <input id="f-email" type="text" inputmode="email" autocomplete="username" autocapitalize="off" spellcheck="false" dir="ltr" aria-describedby="e-email">
        <span class="domain" id="email-domain"></span>
      </div>
      <div class="err" id="e-email" aria-live="polite"></div>
      <label class="check" id="events-opt"><input type="checkbox" id="f-events" checked> <span data-t="showEvents"></span></label>

      <div class="fixed">
        <span data-t="fixedNote"></span><br>
        <b id="fx-org"></b><br>
        <span dir="ltr" id="fx-web"></span>
      </div>
    </section>

    <section class="out" aria-labelledby="outh">
      <h2 id="outh" data-t="preview"></h2>
      <div class="stage">
        <div class="stagebar">
          <span data-t="inbox"></span>
          <div class="seg" role="group" aria-label="Layout" id="layout-switch">
            <button type="button" data-layout="A" aria-pressed="false" data-t="layoutA"></button>
            <button type="button" data-layout="B" aria-pressed="true" data-t="layoutB"></button>
          </div>
          <div class="seg" role="group" aria-label="Logo" id="logo-switch">
          </div>
          <div class="seg" role="group" aria-label="Preview background">
            <button type="button" data-bg="light" aria-pressed="true" data-t="light"></button>
            <button type="button" data-bg="dark" aria-pressed="false" data-t="dark"></button>
          </div>
        </div>
        <div class="mail" id="mail">
          <p class="body" id="mailbody"></p>
          <div id="sig"></div>
        </div>
      </div>
      <p class="note" id="darknote" hidden data-t="darkNote"></p>

      <div class="appq">
        <span class="appq-label" id="app-label" data-t="appQ"></span>
        <div class="seg" role="group" aria-labelledby="app-label">
          <button type="button" data-app="outlook" aria-pressed="true">Outlook</button>
          <button type="button" data-app="gmail" aria-pressed="false">Gmail</button>
          <button type="button" data-app="apple" aria-pressed="false">Apple Mail</button>
        </div>
      </div>
      <div class="actions">
        <button class="btn primary" type="button" id="copy" data-t="copy"></button>
        <button class="btn ghost" type="button" id="copycode" data-t="copyCode"></button>
      </div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <div class="meter" id="meter"></div>

      <details open>
        <summary data-t="howTo"></summary>
        <div class="guide">
          <div class="tabs" role="tablist">
            <button role="tab" type="button" data-tab="gmail" aria-selected="true">Gmail</button>
            <button role="tab" type="button" data-tab="owa" aria-selected="false">Outlook (web)</button>
            <button role="tab" type="button" data-tab="outlook" aria-selected="false">Outlook (desktop)</button>
            <button role="tab" type="button" data-tab="apple" aria-selected="false">Apple Mail</button>
          </div>
          <ol id="steps"></ol>
        </div>
      </details>

      <details>
        <summary data-t="code"></summary>
        <pre id="code"></pre>
      </details>
    </section>
  </div>
</div>

<script>

const $ = (s)=>document.querySelector(s);
const FIELDS = ["name","title","dept","mobile","office","email"];
let lang = "he", bg = "light", tab = "outlook", app = "outlook";
// Outlook blocks linked images by default, so for Outlook the logo travels inside the signature.
const embedLogo = ()=>app==="outlook";
const data = { he:{}, en:{} };
let showEvents = true;
let logoStyle = CONFIG.LOGO_STYLE;
let layout = CONFIG.LAYOUT;


const esc = (s)=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const telHref = (s)=>{ let d=String(s).replace(/[^\d+]/g,""); if(d.startsWith("0")) d="+972"+d.slice(1); return d; };
const validEmail = (s)=>/^[A-Za-z0-9._%+-]+$/.test(s) && !/^\.|\.$|\.\./.test(s);
const fullEmail = (local)=>`${local}@${CONFIG.EMAIL_DOMAIN}`;

function load(){
  try{ const s=JSON.parse(localStorage.getItem("adssc-sig-v2")||"null"); if(s){ Object.assign(data,s.data||{}); lang=s.lang||lang; if(typeof s.showEvents==="boolean") showEvents=s.showEvents; } }catch(e){}
}
function save(){ try{ localStorage.setItem("adssc-sig-v2",JSON.stringify({data,lang,showEvents})); }catch(e){} }

function buildSig(d, l, preview, embed){
  const rtl = l==="he", al = rtl?"right":"left", C=CONFIG, t=T[l];
  const dirAttr = rtl?' dir="rtl"':' dir="ltr"';
  const rule = rtl?`border-right:2px solid ${C.ACCENT};padding-right:24px;`:`border-left:2px solid ${C.ACCENT};padding-left:24px;`;
  const isMark = logoStyle!=="lockup";
  const L = isMark ? C.MARK[logoStyle] : C.LOGO[l];
  // Preview uses an embedded copy (the page can't load remote images); the copied signature uses the hosted URL.
  const src = (preview || embed) ? (isMark ? PREVIEW_MARK[logoStyle] : PREVIEW_LOGO[l]) : L.url;
  const logo = src ? `<img src="${esc(src)}" width="${L.width}" height="${L.height}" alt="${esc(C.ORG[l])}" style="display:block;width:${L.width}px;height:${L.height}px;border:0;">` : "";
  const line = (html, extra="")=>`<tr><td align="${al}" style="font-family:${C.FONT};${extra}">${html}</td></tr>`;
  const link = (href, text)=>`<a href="${href}" style="color:${C.INK};text-decoration:none;"><span dir="ltr">${esc(text)}</span></a>`;
  const phones = [];
  if(d.mobile) phones.push(`<span style="color:${C.MUTED};">${t.mob}</span>&nbsp;${link("tel:"+esc(telHref(d.mobile)), d.mobile)}`);
  if(d.office) phones.push(`<span style="color:${C.MUTED};">${t.tel}</span>&nbsp;${link("tel:"+esc(telHref(d.office)), d.office)}`);
  const web = C.WEBSITE.replace(/^https?:\/\//,"");
  const evRow = (showEvents && C.EVENTS_URL) ? line(
    `<a href="${esc(C.EVENTS_URL)}" style="color:${C.ACCENT};text-decoration:underline;font-weight:bold;">${t.eventsLink}</a>`,
    `font-size:12px;line-height:18px;padding-top:6px;`) : "";
  const sep = `&nbsp;&nbsp;<span style="color:#C7CFCE;">|</span>&nbsp;&nbsp;`;
  const rowsB = [
    // 1. who: name dominates, role and unit share one quieter line
    line(esc(d.name), `font-size:17px;line-height:22px;font-weight:bold;color:${C.INK};`),
    line(esc(d.title) + (d.dept ? `${sep}<span style="color:${C.ACCENT};">${esc(d.dept)}</span>` : ""),
      `font-size:13px;line-height:18px;color:${C.MUTED};padding-top:1px;`),
    // 2. where: organization, set apart by space rather than weight
    line(esc(C.ORG[l]), `font-size:14px;line-height:18px;font-weight:bold;color:${C.ACCENT};padding-top:12px;padding-bottom:4px;`),
    // 3. how to reach: compact, uniform contact lines
    phones.length ? line(phones.join(sep), `font-size:12px;line-height:17px;color:${C.INK};`) : "",
    line(link("mailto:"+esc(fullEmail(d.email)), fullEmail(d.email)) + sep +
      `<a href="https://${esc(web)}" style="color:${C.INK};text-decoration:none;"><span dir="ltr">${esc(web)}</span></a>`,
      `font-size:12px;line-height:17px;`),
    evRow
  ].join("");
  const rowsA = [
    line(esc(d.name), `font-size:15px;line-height:20px;font-weight:bold;color:${C.INK};`),
    line(esc(d.title), `font-size:13px;line-height:18px;color:${C.MUTED};`),
    d.dept ? line(esc(d.dept), `font-size:13px;line-height:18px;color:${C.ACCENT};`) : "",
    line(esc(C.ORG[l]), `font-size:12px;line-height:18px;font-weight:bold;color:${C.INK};padding-top:8px;`),
    phones.length ? line(phones.join(`&nbsp;&nbsp;<span style="color:#C7CFCE;">|</span>&nbsp;&nbsp;`), `font-size:12px;line-height:18px;color:${C.INK};`) : "",
    line(link("mailto:"+esc(fullEmail(d.email)), fullEmail(d.email)), `font-size:12px;line-height:18px;`),
    line(`<a href="https://${esc(web)}" style="color:${C.ACCENT};text-decoration:none;"><span dir="ltr">${esc(web)}</span></a>`, `font-size:12px;line-height:18px;`),
    evRow
  ].join("");
  const rows = layout==="B" ? rowsB : rowsA;
  // Fixed cell widths stop Outlook from stretching the logo column; spare width falls to the far side of the text.
  const logoCells = logo
    ? `<td width="${L.width}" valign="middle" style="width:${L.width}px;">${logo}</td><td width="24" style="width:24px;font-size:0;line-height:0;">&nbsp;</td>`
    : "";
  const textW = C.TABLE_WIDTH - (logo ? L.width + 24 : 0);
  return `<table width="${C.TABLE_WIDTH}" cellpadding="0" cellspacing="0" border="0"${dirAttr} style="border-collapse:collapse;width:${C.TABLE_WIDTH}px;"><tr>${logoCells}<td width="${textW}" valign="top" align="${al}" style="${rule}"><table cellpadding="0" cellspacing="0" border="0"${dirAttr} style="border-collapse:collapse;">${rows}</table></td></tr></table>`;
}

function applyLang(){
  const t=T[lang];
  document.documentElement.lang = lang; document.documentElement.dir = lang==="he"?"rtl":"ltr";
  document.querySelectorAll("[data-t]").forEach(el=>{ const v=t[el.dataset.t]; if(typeof v==="string") el.textContent=v; });
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.lang===lang)));
  FIELDS.forEach(f=>{ $("#f-"+f).value = data[lang][f]||""; });
  $("#fx-org").textContent = CONFIG.ORG[lang];
  $("#fx-web").textContent = CONFIG.WEBSITE;
  const mail=$("#mail"); mail.dir = lang==="he"?"rtl":"ltr"; mail.style.textAlign = lang==="he"?"right":"left";
  $("#mailbody").innerHTML = t.body;
  $("#status").textContent="";
  $("#f-events").checked = showEvents;
  renderGuide(); render();
}

function render(){
  const d=data[lang], t=T[lang];
  // While the form is completely empty, preview the sample so the design is visible.
  const blank = FIELDS.every(f=>!d[f]);
  $("#sig").innerHTML = buildSig(blank ? T[lang].sample : d, lang, true);
  $("#sig").style.opacity = blank ? ".45" : "1";
  const code = buildSig(d, lang, false, embedLogo());
  $("#code").textContent = code;
  const emailBad = d.email && !validEmail(d.email);
  $("#f-email").setAttribute("aria-invalid", String(!!emailBad));
  $("#e-email").textContent = emailBad ? t.badEmail : "";
  $("#meter").textContent = embedLogo() ? t.embedNote : t.chars(code.length);
}

function renderGuide(){
  document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.tab===tab)));
  $("#steps").innerHTML = T[lang].guide[tab].map(s=>`<li>${esc(s)}</li>`).join("");
}

function setStatus(msg, bad){ const s=$("#status"); s.textContent=msg; s.classList.toggle("bad", !!bad); }

function ready(){
  const d=data[lang];
  if(!d.name || !d.title || !d.email){ setStatus(T[lang].needFields, true); return false; }
  if(!validEmail(d.email)){ setStatus(T[lang].badEmail, true); $("#f-email").focus(); return false; }
  return true;
}

function fallbackCopy(html){
  const box=document.createElement("div");
  box.contentEditable="true"; box.innerHTML=html;
  box.style.cssText="position:fixed;left:-9999px;top:0;background:#fff;";
  document.body.appendChild(box);
  const r=document.createRange(); r.selectNodeContents(box);
  const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r);
  let ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
  sel.removeAllRanges(); box.remove(); return ok;
}

$("#copy").addEventListener("click", async ()=>{
  if(!ready()) return;
  const html = buildSig(data[lang], lang, false, embedLogo());
  const plain = $("#sig").innerText;
  let ok=false;
  try{
    if(window.ClipboardItem && navigator.clipboard?.write){
      await navigator.clipboard.write([new ClipboardItem({
        "text/html": new Blob([html],{type:"text/html"}),
        "text/plain": new Blob([plain],{type:"text/plain"})
      })]); ok=true;
    }
  }catch(e){}
  if(!ok) ok = fallbackCopy(html);
  setStatus(ok ? T[lang].copied : T[lang].copyFail, !ok);
});

$("#copycode").addEventListener("click", async ()=>{
  if(!ready()) return;
  const code = buildSig(data[lang], lang, false, embedLogo());
  let ok=false;
  try{ await navigator.clipboard.writeText(code); ok=true; }catch(e){
    const ta=document.createElement("textarea"); ta.value=code; ta.style.cssText="position:fixed;left:-9999px";
    document.body.appendChild(ta); ta.select(); try{ ok=document.execCommand("copy"); }catch(_){} ta.remove();
  }
  setStatus(ok ? T[lang].codeCopied : T[lang].copyFail, !ok);
});

$("#email-domain").textContent = "@" + CONFIG.EMAIL_DOMAIN;
$("#f-email").addEventListener("keydown", e=>{ if(e.key==="@") e.preventDefault(); });
$("#f-email").addEventListener("input", e=>{
  const el=e.target, i=el.value.indexOf("@");
  if(i>-1){ el.value = el.value.slice(0,i); }
});
FIELDS.forEach(f=>$("#f-"+f).addEventListener("input", e=>{ data[lang][f]=e.target.value.trim(); save(); render(); }));
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click", ()=>{ lang=b.dataset.lang; save(); applyLang(); }));
document.querySelectorAll("[data-bg]").forEach(b=>b.addEventListener("click", ()=>{
  bg=b.dataset.bg;
  document.querySelectorAll("[data-bg]").forEach(x=>x.setAttribute("aria-pressed", String(x.dataset.bg===bg)));
  $("#mail").classList.toggle("dark", bg==="dark");
  $("#darknote").hidden = bg!=="dark";
}));
document.querySelectorAll("[data-app]").forEach(b=>b.addEventListener("click", ()=>{
  app=b.dataset.app; tab=app;
  document.querySelectorAll("[data-app]").forEach(x=>x.setAttribute("aria-pressed", String(x.dataset.app===app)));
  $("#status").textContent=""; renderGuide(); render();
}));
document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click", ()=>{ tab=b.dataset.tab; renderGuide(); }));


$("#f-events").addEventListener("change", e=>{ showEvents=e.target.checked; save(); render(); });
$("#events-opt").hidden = !CONFIG.EVENTS_URL;
$("#logo-switch").hidden = !CONFIG.SHOW_LOGO_SWITCH;
$("#layout-switch").hidden = !CONFIG.SHOW_LAYOUT_SWITCH;
const syncLayout = ()=>document.querySelectorAll("[data-layout]").forEach(x=>x.setAttribute("aria-pressed", String(x.dataset.layout===layout)));
document.querySelectorAll("[data-layout]").forEach(b=>b.addEventListener("click", ()=>{ layout=b.dataset.layout; syncLayout(); render(); }));
syncLayout();
document.querySelectorAll("[data-logo]").forEach(b=>b.addEventListener("click", ()=>{
  logoStyle=b.dataset.logo;
  document.querySelectorAll("[data-logo]").forEach(x=>x.setAttribute("aria-pressed", String(x.dataset.logo===logoStyle)));
  render();
}));
document.querySelectorAll("[data-logo]").forEach(x=>x.setAttribute("aria-pressed", String(x.dataset.logo===logoStyle)));
load(); applyLang();
</script>
</body>
</html>
